<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRMoment Web</title>
    <link rel="icon" href="logo192.png">
    <link rel="stylesheet" href="material-symbols.css">
    <link rel="stylesheet" href="style.css">

    <!-- Blocking script: apply theme BEFORE body renders, preventing flash -->
    <script>
        (function() {
            var THEME_KEY = 'crmoment-theme';
            var saved = localStorage.getItem(THEME_KEY);
            var theme;
            if (saved) {
                theme = saved;
            } else {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header id="app-bar">
        <a href="/" class="app-title-link">
            <img src="crmomentlogo.png" alt="CRMoment" class="app-title" id="app-logo">
        </a>
        <div class="top-bar-right">
            <button class="btn-icon theme-toggle" id="btn-theme-toggle" title="切换主题">
                <span class="material-symbols-outlined">light_mode</span>
            </button>
            <div class="nav-auth" id="nav-auth">
                <button class="btn-primary" id="btn-login">
                    <span class="material-symbols-outlined">login</span>
                    登录
                </button>
            </div>
            <div class="nav-user" id="nav-user" style="display:none">
                <button class="btn-icon" id="btn-notifications" style="position:relative">
                    <span class="material-symbols-outlined">notifications</span>
                    <span class="notif-badge" id="notif-badge" style="display:none"></span>
                </button>
                <button class="btn-icon" id="btn-user-avatar">
                    <img id="user-avatar-img" src="/uploads/avatars/default.svg" alt="" class="avatar-small">
                </button>
            </div>
        </div>
    </header>

    <!-- Sub Navigation -->
    <div class="sub-nav" id="sub-nav">
        <button class="nav-btn active" data-page="home">
            <span class="material-symbols-outlined">home</span>
            <span>主页</span>
        </button>
        <button class="nav-btn" data-page="messages" id="nav-messages" style="display:none">
            <span class="material-symbols-outlined">chat</span>
            <span>信息</span>
            <span class="notif-badge" id="msg-badge" style="display:none"></span>
        </button>
        <button class="nav-btn" data-page="explore">
            <span class="material-symbols-outlined">explore</span>
            <span>发现</span>
        </button>
        <button class="nav-btn" data-page="profile" id="nav-profile" style="display:none">
            <span class="material-symbols-outlined">person</span>
            <span>我的</span>
        </button>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="main-content"></main>

    <!-- Auth Dialog -->
    <div class="modal-overlay" id="auth-overlay">
        <div class="modal">
            <div class="modal-headline" id="auth-title">登录</div>
            <div class="modal-content">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="auth-tab-login">登录</button>
                    <button class="auth-tab" id="auth-tab-register">注册</button>
                </div>
                <div class="field-group">
                    <input type="text" id="auth-username" class="field-input" placeholder="用户名" required minlength="2" maxlength="50" autocomplete="username">
                </div>
                <div class="field-group" id="auth-nickname-group" style="display:none">
                    <input type="text" id="auth-nickname" class="field-input" placeholder="昵称" required minlength="2" maxlength="50">
                </div>
                <div class="field-group">
                    <input type="password" id="auth-password" class="field-input" placeholder="密码" required minlength="6" autocomplete="current-password">
                </div>
                <div class="field-group" id="auth-password-confirm-group" style="display:none">
                    <input type="password" id="auth-password-confirm" class="field-input" placeholder="确认密码" required minlength="6" autocomplete="new-password">
                </div>
                <div id="auth-error" class="error-message" style="display:none"></div>
                <!-- Cloudflare Turnstile 人机验证小部件 -->
                <div id="turnstile-widget" style="margin-top:12px"></div>
                <div id="ragemi-oauth-group">
                    <div class="oauth-divider"><span>或</span></div>
                    <a href="#" id="btn-ragemi-login" class="btn-oauth">使用 Ragemi 登录</a>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="auth-cancel">取消</button>
                <button class="btn-primary" id="auth-submit">登录</button>
            </div>
        </div>
    </div>

    <!-- Composer Dialog -->
    <div class="modal-overlay" id="composer-overlay">
        <div class="modal">
            <div class="modal-headline">发布动态</div>
            <div class="modal-content">
                <textarea id="composer-content" class="field-input" placeholder="说点什么..." rows="4" maxlength="2000"></textarea>
                <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
                    <button class="btn-icon" id="btn-add-image" title="添加图片">
                        <span class="material-symbols-outlined">add_photo_alternate</span>
                    </button>
                    <button class="btn-icon" id="btn-add-video" title="添加视频">
                        <span class="material-symbols-outlined">video_library</span>
                    </button>
                    <input type="file" id="composer-images-input" accept="image/*" multiple style="display:none">
                    <input type="file" id="composer-videos-input" accept="video/*" style="display:none">
                    <span id="media-count" style="font-size:13px;color:var(--ba-text-muted)"></span>
                </div>
                <div id="image-preview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
                <div id="video-preview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="composer-cancel">取消</button>
                <button class="btn-primary" id="composer-submit">发布</button>
            </div>
        </div>
    </div>

    <!-- Notification Dialog -->
    <div class="modal-overlay" id="notif-overlay">
        <div class="modal">
            <div class="modal-headline">通知</div>
            <div class="modal-content">
                <div id="notif-list" class="notif-list"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="notif-read-all">全部已读</button>
                <button class="btn-text" id="notif-close">关闭</button>
            </div>
        </div>
    </div>

    <!-- Comment Dialog -->
    <div class="modal-overlay" id="comment-overlay">
        <div class="modal">
            <div class="modal-headline" id="comment-title">评论</div>
            <div class="modal-content">
                <div id="comment-list" class="comment-list"></div>
                <div id="comment-reply-bar" class="comment-reply-bar" style="display:none">
                    <span class="reply-indicator">回复 <span id="comment-reply-username"></span></span>
                    <button class="btn-text" id="comment-reply-cancel">取消</button>
                </div>
                <textarea id="comment-input" class="comment-input" rows="2" placeholder="写评论..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="comment-cancel">关闭</button>
                <button class="btn-primary" id="comment-submit">发送</button>
            </div>
        </div>
    </div>

    <!-- Image Viewer Overlay (动态创建) -->

    <!-- Create Group Dialog -->
    <div class="modal-overlay" id="create-group-overlay">
        <div class="modal">
            <div class="modal-headline">创建群聊</div>
            <div class="modal-content">
                <div class="field-group">
                    <input type="text" id="group-name-input" class="field-input" placeholder="群聊名称" required minlength="1" maxlength="50">
                </div>
                <div style="font-size:14px;font-weight:500;color:var(--ba-text-secondary);margin-top:8px;margin-bottom:4px">选择成员</div>
                <div id="group-member-list" class="group-member-list"></div>
                <div id="group-member-error" class="error-message" style="display:none"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="create-group-cancel">取消</button>
                <button class="btn-primary" id="create-group-submit">创建</button>
            </div>
        </div>
    </div>

    <!-- Add Music Dialog -->
    <div class="modal-overlay" id="add-music-overlay">
        <div class="modal">
            <div class="modal-headline">添加音乐</div>
            <div class="modal-content">
                <div class="field-group">
                    <input type="text" id="music-title" class="field-input" placeholder="音乐名称" required minlength="1" maxlength="200">
                </div>
                <div class="field-group">
                    <input type="url" id="music-url" class="field-input" placeholder="音频链接" required>
                </div>
                <div class="field-group">
                    <input type="url" id="music-lrc-url" class="field-input" placeholder="歌词文件链接" required>
                </div>
                <div class="field-group">
                    <input type="url" id="music-bg-url" class="field-input" placeholder="背景图片链接（可选）">
                </div>
                <div class="field-group">
                    <input type="url" id="music-video-url" class="field-input" placeholder="背景视频链接（可选）">
                </div>
                <div style="margin-top:8px;font-size:14px;color:var(--ba-text-secondary);margin-bottom:4px">歌词位置</div>
                <div class="lrc-pos-group">
                    <label class="lrc-pos-option"><input type="radio" name="lrc_pos" value="left" class="lrc-pos-radio"><span>左侧</span></label>
                    <label class="lrc-pos-option"><input type="radio" name="lrc_pos" value="center" checked class="lrc-pos-radio"><span>居中</span></label>
                    <label class="lrc-pos-option"><input type="radio" name="lrc_pos" value="right" class="lrc-pos-radio"><span>右侧</span></label>
                    <label class="lrc-pos-option"><input type="radio" name="lrc_pos" value="none" class="lrc-pos-radio"><span>隐藏</span></label>
                </div>
                <div style="margin-top:8px;font-size:14px;color:var(--ba-text-secondary);margin-bottom:4px">歌词颜色</div>
                <div class="lrc-pos-group">
                    <label class="lrc-pos-option"><input type="radio" name="lrc_color" value="light" checked class="lrc-pos-radio"><span>浅色</span></label>
                    <label class="lrc-pos-option"><input type="radio" name="lrc_color" value="dark" class="lrc-pos-radio"><span>深色</span></label>
                </div>
                <div id="add-music-error" class="error-message" style="display:none"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="add-music-cancel">取消</button>
                <button class="btn-primary" id="add-music-submit">添加</button>
            </div>
        </div>
    </div>

    <!-- Search Music Dialog -->
    <div class="modal-overlay" id="search-music-overlay">
        <div class="modal">
            <div class="modal-headline">搜索音乐</div>
            <div class="modal-content">
                <div class="field-group">
                    <input type="search" id="music-search" class="field-input" placeholder="搜索音乐名称">
                </div>
            </div>
            <div class="modal-actions" style="justify-content:space-between">
                <button class="btn-text" id="search-music-clear">清空</button>
                <div style="display:flex;gap:8px">
                    <button class="btn-text" id="search-music-cancel">取消</button>
                    <button class="btn-primary" id="search-music-submit">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Email Bind Dialog -->
    <div class="modal-overlay" id="email-bind-overlay">
        <div class="modal">
            <div class="modal-headline">绑定邮箱</div>
            <div class="modal-content">
                <div class="field-group">
                    <input type="email" id="email-input" class="field-input" placeholder="请输入邮箱地址" required autocomplete="email">
                </div>
                <div id="email-bind-error" class="error-message" style="display:none"></div>
                <div style="font-size:13px;color:var(--ba-text-muted);margin-top:4px">
                    验证邮件将发送到该邮箱，点击邮件中的链接完成绑定。
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="email-bind-cancel">取消</button>
                <button class="btn-primary" id="email-bind-submit">发送验证邮件</button>
            </div>
        </div>
    </div>

    <!-- Cloudflare Turnstile 人机验证脚本（显式渲染，由 app.js 控制） -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script type="module" src="app.js"></script>
</body>
</html>
