<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRMoment Web</title>

    <link rel="icon" href="/web/logo192.png">

    <!-- Material Icons 字体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap">
    <!-- Roboto 字体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

    <!-- MWC 组件通过 importmap 加载（与参考文件相同的 CDN） -->
    <script type="importmap">
    {
        "imports": {
            "@material/web/": "https://esm.run/@material/web/"
        }
    }
    </script>

    <!-- 使用 /web/ 绝对路径，避免无尾斜杠访问时解析错误 -->
    <link rel="stylesheet" href="/web/style.css">
</head>
<body>
    <!-- 顶部导航栏（粘性，标题左，登录/通知/头像右，在对话框遮罩下方） -->
    <header id="app-bar">
        <a href="/" class="app-title-link">
            <img src="/web/crmomentlogo.png" alt="CRMoment" class="app-title app-title-light">
            <img src="/web/crmomentlogodark.png" alt="CRMoment" class="app-title app-title-dark" style="display:none">
        </a>
        <div class="top-bar-right">
            <md-icon-button id="btn-theme-toggle" title="切换主题">
                <md-icon>light_mode</md-icon>
            </md-icon-button>
            <div class="nav-auth" id="nav-auth">
                <md-filled-tonal-button id="btn-login" class="auth-btn">
                    <md-icon slot="icon">login</md-icon>
                    登录
                </md-filled-tonal-button>
            </div>
            <div class="nav-user" id="nav-user" style="display:none">
                <md-icon-button id="btn-notifications" class="notif-btn">
                    <md-icon>notifications</md-icon>
                    <md-badge id="notif-badge" style="display:none"></md-badge>
                </md-icon-button>
                <md-icon-button id="btn-user-avatar">
                    <img id="user-avatar-img" src="/uploads/avatars/default.svg" alt="" class="avatar-small">
                </md-icon-button>
            </div>
        </div>
    </header>

    <!-- 二级导航栏（主页 / 我的 / 发现，居中，正常放置） -->
    <div class="sub-nav" id="sub-nav">
        <md-text-button class="nav-btn active" data-page="home">
            <md-icon slot="icon">home</md-icon>
            主页
        </md-text-button>
        <md-text-button class="nav-btn" data-page="profile" id="nav-profile" style="display:none">
            <md-icon slot="icon">person</md-icon>
            我的
        </md-text-button>
        <md-text-button class="nav-btn" data-page="explore">
            <md-icon slot="icon">explore</md-icon>
            发现
        </md-text-button>
    </div>

    <!-- 主内容区 -->
    <main class="main-content" id="main-content">
        <!-- 由 app.js 动态渲染 -->
    </main>

    <!-- 登录/注册对话框 -->
    <md-dialog id="auth-dialog">
        <div slot="headline" id="auth-title">登录</div>
        <form slot="content" id="auth-form" method="dialog">
            <div class="auth-tabs">
                <md-text-button id="auth-tab-login" class="auth-tab active">登录</md-text-button>
                <md-text-button id="auth-tab-register" class="auth-tab">注册</md-text-button>
            </div>
            <md-outlined-text-field
                id="auth-username"
                label="用户名"
                type="text"
                required
                minlength="2"
                maxlength="50"
                autocomplete="username"
                class="auth-field"
            ></md-outlined-text-field>
            <md-outlined-text-field
                id="auth-password"
                label="密码"
                type="password"
                required
                minlength="6"
                autocomplete="current-password"
                class="auth-field"
            ></md-outlined-text-field>
            <md-outlined-text-field
                id="auth-password-confirm"
                label="确认密码"
                type="password"
                required
                minlength="6"
                autocomplete="new-password"
                class="auth-field"
                style="display:none"
            ></md-outlined-text-field>
            <div id="auth-error" class="error-message" style="display:none"></div>
        </form>
        <div slot="actions">
            <md-text-button id="auth-cancel">取消</md-text-button>
            <md-filled-button id="auth-submit">登录</md-filled-button>
        </div>
    </md-dialog>

    <!-- 发布动态对话框 -->
    <md-dialog id="composer-dialog">
        <div slot="headline">发布动态</div>
        <form slot="content" id="composer-form">
            <textarea
                id="composer-content"
                class="composer-field"
                placeholder="说点什么..."
                rows="4"
                maxlength="2000"
            ></textarea>
            <div class="composer-tools">
                <md-icon-button id="btn-add-image" title="添加图片">
                    <md-icon>add_photo_alternate</md-icon>
                </md-icon-button>
                <input type="file" id="composer-images-input" accept="image/*" multiple style="display:none">
                <span id="image-count" class="image-count"></span>
            </div>
            <div id="image-preview" class="image-preview"></div>
        </form>
        <div slot="actions">
            <md-text-button id="composer-cancel">取消</md-text-button>
            <md-filled-button id="composer-submit">发布</md-filled-button>
        </div>
    </md-dialog>

    <!-- 通知对话框 -->
    <md-dialog id="notif-dialog">
        <div slot="headline">通知</div>
        <div slot="content" id="notif-list" class="notif-list"></div>
        <div slot="actions">
            <md-text-button id="notif-read-all">全部已读</md-text-button>
            <md-text-button id="notif-close">关闭</md-text-button>
        </div>
    </md-dialog>

    <!-- 评论对话框 -->
    <md-dialog id="comment-dialog">
        <div slot="headline" id="comment-title">评论</div>
        <div slot="content">
            <div id="comment-list" class="comment-list"></div>
            <textarea
                id="comment-input"
                class="comment-input"
                rows="2"
                placeholder="写评论..."
            ></textarea>
        </div>
        <div slot="actions">
            <md-text-button id="comment-cancel">关闭</md-text-button>
            <md-filled-button id="comment-submit">发送</md-filled-button>
        </div>
    </md-dialog>

    <!-- 图片查看器 -->
    <md-dialog id="image-viewer-dialog" class="image-viewer-dialog">
        <div slot="content">
            <img id="image-viewer-img" src="" alt="" class="image-viewer-img">
        </div>
        <div slot="actions">
            <md-text-button id="image-viewer-copy">
                <md-icon slot="icon">share</md-icon>
                分享
            </md-text-button>
            <md-text-button id="image-viewer-open">
                <md-icon slot="icon">open_in_new</md-icon>
                查看图片
            </md-text-button>
            <md-text-button id="image-viewer-close">关闭</md-text-button>
        </div>
    </md-dialog>

    <!-- MWC 初始化 + 应用入口（使用绝对路径） -->
    <script type="module" src="/web/app.js"></script>
</body>
</html>
