<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
    <meta name="renderer" content="webkit">
    <meta name="author" content="mengkun">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-siteapp">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="full-screen" content="yes">
    <meta name="browsermode" content="application">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    
    <title>CRMusic Neo - 在线音乐播放器</title>
    <meta name="description" content="CRMusicNeo 是一个现代化的在线音乐播放器，支持在线听歌和歌曲搜索。"/>
    <meta name="keywords" content="CRMusicNeo,在线音乐,在线听歌,音乐播放器"/>
    
    <!--[if lte IE 8]>
        <script>window.location.href="plugns/killie/"</script>
    <![endif]--> 
    
    <link rel="shortcut icon" href="images/music.svg" type="image/svg+xml">
    
    <script src="js/jquery.min.js"></script>
    
    <link rel="stylesheet" href="plugns/layui/css/layui.css">
    <link rel="stylesheet" type="text/css" href="css/jquery.mCustomScrollbar.min.css">
    <link rel="stylesheet" type="text/css" href="css/player.css">
    <link rel="stylesheet" type="text/css" href="css/small.css">
</head>
<body>

<div id="blur-img"></div>
<!-- 文字溢出提示 -->
<div class="list-tooltip" id="list-tooltip"></div>

<!-- 头部 -->
<div class="header">
    <div class="header-left">
        <span class="logo" title="CRMusic Neo">CRMusic Neo</span>
    </div>
    <div class="header-right">
        <div class="search-inline" id="search-inline">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-wd-inline" placeholder="搜索..." autocomplete="on">
            <svg class="search-clear-btn" id="search-clear-btn" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;cursor:pointer;flex-shrink:0;color:var(--text-muted)">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        </div>
        <div class="source-select" id="source-select-inline">
            <select id="source-inline">
                <option value="netease" selected>网易云</option>
                <option value="kugou">酷狗</option>
                <option value="tencent">QQ</option>
            </select>
        </div>
    </div>
</div>

<!-- 中间主体区域 -->
<div class="center">
    <div class="container">
        <div class="btn-bar">
            <div class="btn-box" id="btn-area">
                <span class="btn" data-action="player" hidden>
                    <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    播放器
                </span>
                <span class="btn" data-action="playing" title="正在播放列表">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    正在播放
                </span>
                <span class="btn" data-action="sheet" title="音乐播放列表">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    播放列表
                </span>
            </div>
        </div>
        
        <div class="data-area">
            <div id="sheet" class="data-box" hidden></div>
            <div id="main-list" class="music-list data-box"></div>
        </div>
        
        <div class="player" id="player">
            <div class="cover">
                <img src="images/music.svg" class="music-cover" id="music-cover">
            </div>
            <div class="now-playing-info" id="now-playing-info">
                <div class="song-title" id="now-playing-title">未在播放</div>
                <div class="song-artist" id="now-playing-artist"></div>
            </div>
            <div class="lyric">
                <ul id="lyric"></ul>
            </div>
            <div id="music-info" title="点击查看歌曲信息">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
        </div>
    </div>
</div>

<!-- 播放器底部区域 -->
<div class="footer">
    <div class="container">
        <div class="con-btn">
            <a href="javascript:;" class="player-btn btn-prev" title="上一首">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
            </a>
            <a href="javascript:;" class="player-btn btn-play" title="暂停/继续">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="icon-play-svg"><path d="M8 5v14l11-7L8 5z"/></svg>
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="icon-pause-svg" style="display:none"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
            </a>
            <a href="javascript:;" class="player-btn btn-next" title="下一首">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/></svg>
            </a>
            <a href="javascript:;" class="player-btn btn-order" title="单曲循环">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon-order-single"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="bold" font-family="sans-serif" fill="currentColor" stroke="none">1</text></svg>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="icon-order-list" style="display:none"><path d="M17 8l4 4-4 4V13H7V11h10V8zM3 6h2v12H3V6z"/></svg>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="icon-order-random" style="display:none"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </a>
        </div>
        
        <div class="vol">
            <div class="quiet">
                <a href="javascript:;" class="player-btn btn-quiet" title="静音">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="icon-volume-on"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="icon-volume-off" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </a>
            </div>
            <div class="volume">
                <div class="volume-box">  
                    <div id="volume-progress" class="mkpgb-area"></div>
                </div>
            </div>
        </div>
        
        <div class="progress">
            <div class="progress-box">  
                <div id="music-progress" class="mkpgb-area"></div>
                <div class="audio-time">00:00/00:00</div>
            </div>
        </div>
    </div>
</div>

<script src="plugns/layui/layui.js"></script>
<script src="js/player.js"></script>
<script src="js/ajax.js"></script>
<script src="js/lyric.js"></script>
<script src="js/musicList.js"></script>
<script src="js/functions.js"></script>
<script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
<script src="js/background-blur.min.js"></script>

</body>
</html>
