<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRMoment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(180deg, #e8f4fa 0%, #f0f7fb 15%, #fdf6f8 40%, #fafcfe 70%, #f5f0f8 100%);
            color: #1d1b20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        .landing {
            text-align: center;
            padding: 48px 32px;
        }

        .logo-img {
            width: 305px;
            height: 125px;
            margin-bottom: 24px;
            object-fit: contain;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4a9fc7, #7ec8e3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #5a6f84;
            max-width: 360px;
            margin: 0 auto 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 28px;
            background: #7ec8e3;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(126, 200, 227, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(126, 200, 227, 0.4);
        }

        .footer {
            margin-top: 40px;
            color: #a0b8cc;
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .landing {
                padding: 32px 20px;
            }
            h1 {
                font-size: 26px;
            }
            .logo-img {
                width: 244px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .logo-img {
                width: 200px;
                height: 82px;
            }
        }

        @media (min-resolution: 2dppx) {
            .logo-img {
                width: 305px;
                height: 125px;
            }
        }
    </style>

    <style>
        /* ===== Dark Mode (sync with web/ app) ===== */
        html[data-theme="dark"] body {
            background: linear-gradient(180deg, #1a1e24 0%, #1e222a 25%, #222730 50%, #1e222a 75%, #1a1e24 100%);
            color: #d4dce8;
        }

        html[data-theme="dark"] h1 {
            background: linear-gradient(135deg, #7A5C2D, #c9a06a);
            background-clip: text;
            -webkit-background-clip: text;
        }

        html[data-theme="dark"] .subtitle {
            color: #b0c0d0;
        }

        html[data-theme="dark"] .btn {
            background: linear-gradient(135deg, #7A5C2D, #6a4c1d);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        html[data-theme="dark"] .btn:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        html[data-theme="dark"] .footer {
            color: #5a6a7a;
        }

        /* Smooth transition for theme changes */
        html[data-theme="dark"] body,
        body {
            transition: background 0.4s ease, color 0.4s ease;
        }
    </style>

    <!-- Blocking script: apply theme BEFORE body renders, preventing flash -->
    <script>
        (function() {
            var THEME_KEY = 'crmoment-theme';
            var saved = localStorage.getItem(THEME_KEY);
            var theme;
            if (saved) {
                theme = saved;
            } else {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="landing">
        <img src="/web/crmomentlogo.png" alt="CRMoment" class="logo-img">
        <p class="subtitle">轻量的社交动态分享平台</p>
        <a href="/web/" class="btn">CRMoment Web</a>
        <p class="footer">CRMoment · Powered by LGCR837</p>
    </div>

    <script>
        // Switch logo based on current theme, and listen for system changes
        (function() {
            var THEME_KEY = 'crmoment-theme';
            function switchLogo() {
                var t = document.documentElement.getAttribute('data-theme') || 'light';
                var logo = document.querySelector('.logo-img');
                if (logo) {
                    logo.src = t === 'dark' ? '/web/crmomentlogodark.png' : '/web/crmomentlogo.png';
                }
            }
            switchLogo();
            // Listen for system theme changes when no saved preference
            if (!localStorage.getItem(THEME_KEY)) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    var t = e.matches ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', t);
                    switchLogo();
                });
            }
        })();
    </script>
</body>
</html>
