<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRMoment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f0ff 0%, #fef7ff 50%, #f3e8fd 100%);
            color: #1d1b20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        .landing {
            text-align: center;
            padding: 48px 32px;
        }

        .logo-img {
            width: 305px;
            height: 125px;
            margin-bottom: 24px;
            object-fit: contain;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #6750a4, #9c27b0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #49454f;
            max-width: 360px;
            margin: 0 auto 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 28px;
            background: #6750a4;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(103, 80, 164, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(103, 80, 164, 0.4);
        }

        .footer {
            margin-top: 40px;
            color: #79747e;
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .landing {
                padding: 32px 20px;
            }
            h1 {
                font-size: 26px;
            }
            .logo-img {
                width: 244px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .logo-img {
                width: 200px;
                height: 82px;
            }
        }

        @media (min-resolution: 2dppx) {
            .logo-img {
                width: 305px;
                height: 125px;
            }
        }
    </style>
</head>
<body>
    <div class="landing">
        <img src="/web/crmomentlogo.png" alt="CRMoment" class="logo-img">
        <p class="subtitle">轻量的社交动态分享平台</p>
        <a href="/web/" class="btn">CRMoment Web</a>
        <p class="footer">CRMoment · Powered by LGCR837</p>
    </div>
</body>
</html>
