# CRMoment - Nginx 配置片段
# 将以下内容添加到 Nginx 的 server 块中
# 适用于 Nginx 环境，替代 .htaccess（Apache 专用）

# API 路由：将所有 /app/* 请求转发到 api_index.php
location /app/ {
    try_files $uri $uri/ /api_index.php?$query_string;
}

# 单独处理 /app（无尾部斜杠），避免 Nginx 返回 301 重定向到 /app/
location = /app {
    # 返回 JSON 信息而非重定向到 /web/
    default_type application/json;
    return 200 '{"code":0,"message":"CRMoment API","data":{"version":"1.0","docs":"/docs/deployment.md"}}';
}

# PHP 处理
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/var/run/php/php8.x-fpm.sock;  # 改为你的 PHP-FPM socket
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

# 上传文件缓存
location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 禁止访问私有文件
location ~* \.(sql|md)$ {
    deny all;
}

# SPA 回退：web/ 目录下不存在的文件，返回 web/index.html
location /web/ {
    try_files $uri $uri/ /web/index.html;
}

# 根路径：先尝试文件，不存在则返回 web/index.html
location / {
    try_files $uri $uri/ /web/index.html;
}
